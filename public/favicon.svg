<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#0E1116"/>
  <rect x="2" y="2" width="96" height="96" rx="20" fill="none" stroke="#262D3D" stroke-width="2"/>
  
  <!-- 2x2 Subgrid Container -->
  <rect x="18" y="18" width="64" height="64" rx="14" fill="#161B22" stroke="#30363D" stroke-width="3"/>
  
  <!-- Grid divider lines -->
  <line x1="50" y1="18" x2="50" y2="82" stroke="#30363D" stroke-width="2"/>
  <line x1="18" y1="50" x2="82" y2="50" stroke="#30363D" stroke-width="2"/>
  
  <!-- Numbers: 9 (gold), 4 (emerald), 2 (blue), 7 (purple) -->
  <text x="34" y="42" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#F59E0B" text-anchor="middle">9</text>
  <text x="66" y="42" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#10B981" text-anchor="middle">4</text>
  <text x="34" y="74" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#3B82F6" text-anchor="middle">2</text>
  <text x="66" y="74" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#8B5CF6" text-anchor="middle">7</text>
</svg>
