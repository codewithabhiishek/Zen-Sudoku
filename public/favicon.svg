<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="grid-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
  </defs>

  <!-- Base Card Body -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#grid-border)" stroke-width="12" opacity="0.9"/>
  
  <!-- Outer Sudoku Grid Outline -->
  <rect x="80" y="80" width="352" height="352" rx="40" fill="#0F172A" stroke="#38BDF8" stroke-width="10"/>
  
  <!-- Inner 2x2 Cell Partition Dividers -->
  <line x1="256" y1="80" x2="256" y2="432" stroke="#38BDF8" stroke-width="8"/>
  <line x1="80" y1="256" x2="432" y2="256" stroke="#38BDF8" stroke-width="8"/>
  
  <!-- Numbers: 9 (Gold), 4 (Emerald), 2 (Blue), 7 (Purple) -->
  <text x="168" y="210" font-family="'Space Grotesk', 'Syne', system-ui, -apple-system, sans-serif" font-weight="900" font-size="124" fill="#F59E0B" text-anchor="middle" dominant-baseline="central">9</text>
  <text x="344" y="210" font-family="'Space Grotesk', 'Syne', system-ui, -apple-system, sans-serif" font-weight="900" font-size="124" fill="#10B981" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="168" y="346" font-family="'Space Grotesk', 'Syne', system-ui, -apple-system, sans-serif" font-weight="900" font-size="124" fill="#3B82F6" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="344" y="346" font-family="'Space Grotesk', 'Syne', system-ui, -apple-system, sans-serif" font-weight="900" font-size="124" fill="#C084FC" text-anchor="middle" dominant-baseline="central">7</text>
</svg>
